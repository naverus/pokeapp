name: pokeapp

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pokeapp
      MYSQL_USER: pokeapp
      MYSQL_PASSWORD: pokeapp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pokeapp-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping: the temporary init server runs without networking, so this only passes once MySQL is really up
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "pokeapp", "-ppokeapp"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      POKEAPP_DB_URL: jdbc:mysql://mysql:3306/pokeapp
      POKEAPP_DB_USERNAME: pokeapp
      POKEAPP_DB_PASSWORD: pokeapp
      POKEAPP_JWT_SECRET: ${POKEAPP_JWT_SECRET:-docker-compose-demo-secret-change-me-please-0123456789}
      POKEAPP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mysql-data:
