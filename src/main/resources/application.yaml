spring:
  application:
    name: ballastlane-pokeapp
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/pokeapp}
    username: ${DB_USERNAME:pokeapp}
    password: ${DB_PASSWORD:pokeapp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: pokeapi-pokemon-list,pokeapi-pokemon,pokeapi-species,pokeapi-evolution-chain
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=6h,recordStats

server:
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

pokeapp:
  pokeapi:
    base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
    connect-timeout: 3s
    read-timeout: 10s
    max-concurrency: 16
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-production-this-is-a-local-dev-secret-of-64-bytes!!}
    token-ttl: ${JWT_TTL:2h}
    issuer: pokeapp
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
