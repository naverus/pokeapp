micronaut:
  application:
    name: collection-micronaut
  server:
    port: ${PORT:8083}
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins: ${POKEAPP_CORS_ALLOWED_ORIGINS:`http://localhost:5173,http://localhost:3000`}
          allowed-methods: GET,POST,PUT,DELETE,OPTIONS
          allowed-headers: Authorization,Content-Type,Accept
          exposed-headers: Location
          allow-credentials: false
  serde:
    serialization:
      inclusion: ALWAYS
      write-dates-as-timestamps: false
  http:
    client:
      connect-timeout: 3s
      read-timeout: 10s
  security:
    enabled: true
    authentication: bearer
    token:
      roles-name: role
      jwt:
        enabled: true
        signatures:
          secret:
            generator:
              secret: ${POKEAPP_JWT_SECRET:`change-me-in-production-this-is-a-local-dev-secret-of-64-bytes!!`}
              jws-algorithm: HS256
        claims-validators:
          issuer: pokeapp

pokeapp:
  pokeapi:
    base-url: ${POKEAPP_POKEAPI_BASE_URL:`https://pokeapi.co/api/v2`}
  security:
    # Tokens are issued by auth-vertx; kept here for configuration parity with the other services.
    token-ttl: ${POKEAPP_JWT_TTL:2h}

datasources:
  default:
    url: ${POKEAPP_DB_URL:`jdbc:mysql://localhost:3307/pokeapp`}
    username: ${POKEAPP_DB_USERNAME:pokeapp}
    password: ${POKEAPP_DB_PASSWORD:pokeapp}
    driver-class-name: com.mysql.cj.jdbc.Driver
    dialect: MYSQL
    maximum-pool-size: 10

jpa:
  default:
    packages-to-scan:
      - org.pokeapp.infrastructure.persistence.entity
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        jdbc:
          time_zone: UTC
        show_sql: false

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration

endpoints:
  all:
    path: /actuator
  health:
    enabled: true
    sensitive: false
    details-visible: NEVER
