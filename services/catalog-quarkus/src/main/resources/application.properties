quarkus.application.name=catalog-quarkus

# --- HTTP ---------------------------------------------------------------
quarkus.http.host=0.0.0.0
quarkus.http.port=8082
quarkus.http.test-port=0
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

# CORS (same env var as the Spring monolith)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${POKEAPP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,HEAD,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Cache-Control,Content-Type
quarkus.http.cors.access-control-max-age=PT1H

# --- Health / OpenAPI ----------------------------------------------------
# Quarkus checks: /q/health, /q/health/live, /q/health/ready
# Actuator-compatible alias: /actuator/health (see HealthAliasResource)
quarkus.smallrye-openapi.info-title=PokeApp Catalog API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# --- PokeAPI client ------------------------------------------------------
pokeapp.pokeapi.base-url=${POKEAPP_POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
pokeapp.pokeapi.connect-timeout=3s
pokeapp.pokeapi.read-timeout=10s
pokeapp.pokeapi.max-concurrency=16

# --- Caffeine caches (successful PokeAPI responses only) ------------------
quarkus.cache.caffeine."pokeapi-pokemon-list".maximum-size=5000
quarkus.cache.caffeine."pokeapi-pokemon-list".expire-after-write=6H
quarkus.cache.caffeine."pokeapi-pokemon".maximum-size=5000
quarkus.cache.caffeine."pokeapi-pokemon".expire-after-write=6H
quarkus.cache.caffeine."pokeapi-species".maximum-size=5000
quarkus.cache.caffeine."pokeapi-species".expire-after-write=6H
quarkus.cache.caffeine."pokeapi-evolution-chain".maximum-size=5000
quarkus.cache.caffeine."pokeapi-evolution-chain".expire-after-write=6H

# --- Logging -------------------------------------------------------------
quarkus.log.category."org.pokeapp".level=INFO

# --- Tests: stub PokeAPI started by the test suite ------------------------
%test.pokeapp.pokeapi.base-url=http://localhost:18089/api/v2
%test.pokeapp.pokeapi.read-timeout=2s
%test.quarkus.http.cors.origins=http://localhost:3000
quarkus.log.category."com.github.benmanes.caffeine".level=ERROR
