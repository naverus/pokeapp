# Documentation of the supported environment variables and their defaults.
# The service reads environment variables (and -D system properties of the same name).
#
# HTTP_PORT=8081
# POKEAPP_JWT_SECRET=<required, min 32 bytes>
# POKEAPP_JWT_TTL=2h
# POKEAPP_JWT_ISSUER=pokeapp
# POKEAPP_DB_URL=jdbc:mysql://localhost:3307/pokeapp   (or POKEAPP_DB_HOST / POKEAPP_DB_PORT / POKEAPP_DB_NAME)
# POKEAPP_DB_USERNAME=pokeapp
# POKEAPP_DB_PASSWORD=pokeapp
# POKEAPP_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
